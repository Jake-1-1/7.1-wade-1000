<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <title>Tres tacos al pastor en un plato</title>
  <ellipse cx="300" cy="320" rx="250" ry="45" fill="#111111" opacity="0.15"/>
  <ellipse cx="300" cy="300" rx="250" ry="45" fill="#ffffff" stroke="#111111" stroke-width="6"/>
  <g stroke="#111111" stroke-width="6" stroke-linejoin="round">
    <!-- Taco izquierdo -->
    <path d="M70 290 A95 95 0 0 1 260 290 Z" fill="#ffd166"/>
    <path d="M95 250 q20 -30 45 -10 q20 -30 45 -5 q25 -25 45 5" fill="#e11d2e"/>
    <!-- Taco derecho -->
    <path d="M340 290 A95 95 0 0 1 530 290 Z" fill="#ffd166"/>
    <path d="M365 250 q20 -30 45 -10 q20 -30 45 -5 q25 -25 45 5" fill="#e11d2e"/>
    <!-- Taco central -->
    <path d="M190 290 A110 110 0 0 1 410 290 Z" fill="#ffc43d"/>
    <path d="M215 240 q25 -35 55 -12 q25 -35 55 -6 q30 -30 55 6" fill="#e11d2e"/>
  </g>
  <g stroke="#111111" stroke-width="4">
    <circle cx="250" cy="215" r="10" fill="#2bb24c"/>
    <circle cx="300" cy="205" r="10" fill="#ffffff"/>
    <circle cx="350" cy="215" r="10" fill="#2bb24c"/>
    <rect x="285" y="180" width="30" height="20" rx="4" fill="#ffd166"/>
  </g>
  <!-- Chiles -->
  <path d="M500 110 q40 10 50 60 q-30 -20 -60 -40 z" fill="#e11d2e" stroke="#111111" stroke-width="5"/>
  <path d="M500 110 q-5 -20 10 -25" fill="none" stroke="#2bb24c" stroke-width="6" stroke-linecap="round"/>
  <path d="M90 90 l10 25 l25 5 l-20 15 l5 25 l-20 -15 l-22 13 l7 -25 l-18 -17 l25 -2 z" fill="#ffd166" stroke="#111111" stroke-width="4" stroke-linejoin="round"/>
</svg>
